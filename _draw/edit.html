<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Stroke editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #fafafa;
      color: #1a1a1a;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      max-width: calc(100vw - 24px);
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      z-index: 3;
    }

    .tools { top: 12px; flex-wrap: wrap; justify-content: center; border-radius: 16px; width: max-content; }
    .group { display: flex; align-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid rgba(0, 0, 0, 0.08); white-space: nowrap; }
    .group[hidden] { display: none; }
    #size { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
    .chips { bottom: 12px; flex-wrap: wrap; justify-content: center; border-radius: 16px; }

    button {
      font: inherit;
      border: none;
      border-radius: 999px;
      padding: 7px 13px;
      background: #f0f0f2;
      color: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: 0.4; cursor: default; }
    button.on, #save { background: #2563eb; color: #fff; }

    .chips button { padding: 4px 9px; min-width: 32px; font-variant-numeric: tabular-nums; }

    #status { padding: 0 8px; color: #6e6e73; white-space: nowrap; }

    #preview {
      position: fixed;
      overflow: hidden;
      border-radius: 12px;
      background: #18181b;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
      z-index: 1;
    }

    #preview[hidden] { display: none; }
    #preview iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="bar tools">
    <button id="undo" disabled>Undo</button>
    <button id="all">Select all</button>
    <button id="smaller" disabled>Smaller</button>
    <button id="bigger" disabled>Bigger</button>
    <button id="ccw" disabled title="Rotate counterclockwise (hold to keep turning)">↺</button>
    <button id="cw" disabled title="Rotate clockwise (hold to keep turning)">↻</button>
    <button id="step" title="Rotation per step">0.25°</button>
    <button id="delete" disabled>Delete</button>
    <button id="none" disabled>Deselect</button>
    <button id="restore" hidden>Restore draft</button>
    <button id="save">Save</button>
    <span class="group">Size on site <button id="shrink">−</button><span id="size">100%</span><button id="grow">+</button></span>
    <span class="group" id="hero-tools">
      <button data-device="desktop" class="on">Desktop</button>
      <button data-device="phone">Phone</button>
      <button id="recenter">Center</button>
      <button id="replay">Replay</button>
    </span>
    <span class="group"><button id="mode">Raw strokes</button></span>
    <span id="status">Tap a stroke</span>
  </div>

  <div class="bar chips" id="chips"></div>

  <div id="preview"><iframe id="site" title="Site preview" src="../"></iframe></div>

  <script type="module">
    import { prepareStroke, strokePath } from '../pen.js';

    const PAD = 16;
    const PEN_SIZE = 5;
    const DEVICES = { desktop: [1280, 800], phone: [390, 844] };

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const chips = document.getElementById('chips');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    const site = document.getElementById('site');
    const buttons = Object.fromEntries(['undo', 'all', 'smaller', 'bigger', 'ccw', 'cw', 'step', 'delete', 'none', 'restore', 'save', 'shrink', 'grow', 'replay', 'recenter', 'mode'].map(id => [id, document.getElementById(id)]));

    const data = await (await fetch('../handwriting.json', { cache: 'no-store' })).json();
    let strokes = data.strokes.map(flat => {
      const pts = [];
      for (let i = 0; i < flat.length; i += 4) pts.push([flat[i], flat[i + 1], flat[i + 2], flat[i + 3]]);
      return pts;
    });
    // Which strokes are pupils (they follow the cursor on the site) and which are drawn lighter, by index,
    // plus how large the whole drawing appears on the site and where it sits. Scaling or moving every
    // stroke wouldn't change either, since the site fits the drawing to its space.
    let marks = { eyes: data.eyes || [], weight: data.weight || {}, pauseAfter: data.pauseAfter || {}, size: data.size ?? 1, offset: data.offset ?? { x: 0, y: 0 } };
    let selected = new Set();
    let history = [];
    let rawPaths = [];
    let heroPaths = { size: 0, list: [] };
    let mode = 'hero';
    let device = 'desktop';
    let rawView = { scale: 1, x: 0, y: 0 };
    let drag = null;
    const STEPS = [0.25, 0.1, 1];
    let step = STEPS[0];
    let turned = 0;

    // Edits are kept as a draft in this browser until a save reaches the server, so a reload,
    // a navigation or a failed save never loses them.
    const DRAFT_KEY = 'stroke-editor-draft';
    const state = () => JSON.stringify({ strokes, marks });
    function setState(json) {
      const saved = JSON.parse(json);
      strokes = Array.isArray(saved) ? saved : saved.strokes;
      if (!Array.isArray(saved)) marks = saved.marks;
    }
    const loaded = state();
    let draft = null;
    try { draft = localStorage.getItem(DRAFT_KEY); } catch {}
    buttons.restore.hidden = !draft || draft === loaded;

    const snapshot = () => history.push(state());
    function changed() {
      rawPaths = [];
      heroPaths.list = [];
      try { localStorage.setItem(DRAFT_KEY, state()); } catch {}
      sendPreview();
      updateUI();
      draw();
    }

    function bounds(list) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const s of list) for (const [x, y] of s) {
        x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
      }
      return { x0, y0, x1, y1 };
    }

    function exportData() {
      const b = bounds(strokes);
      const r = n => Math.round(n * 10) / 10;
      const out = {
        width: Math.ceil(b.x1 - b.x0) + PAD * 2,
        height: Math.ceil(b.y1 - b.y0) + PAD * 2,
        strokes: strokes.map(s => s.flatMap(([x, y, t, p]) => [r(x - b.x0 + PAD), r(y - b.y0 + PAD), Math.round(t), p])),
      };
      if (marks.eyes.length) out.eyes = marks.eyes;
      if (Object.keys(marks.weight).length) out.weight = marks.weight;
      if (Object.keys(marks.pauseAfter ?? {}).length) out.pauseAfter = marks.pauseAfter;
      if ((marks.size ?? 1) !== 1) out.size = marks.size;
      if (marks.offset && (marks.offset.x || marks.offset.y)) out.offset = marks.offset;
      return out;
    }

    function sendPreview(instant = true) {
      site.contentWindow?.postMessage({ handwriting: exportData(), instant }, location.origin);
    }

    let previewQueued = false;
    function queuePreview() {
      if (previewQueued) return;
      previewQueued = true;
      requestAnimationFrame(() => { previewQueued = false; sendPreview(); });
    }

    function layout() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      preview.hidden = mode !== 'hero';
      document.getElementById('hero-tools').hidden = mode !== 'hero';
      updateUI();
      const top = document.querySelector('.tools').getBoundingClientRect().bottom + 12;
      const bottom = chips.getBoundingClientRect().top - 12;
      if (mode === 'hero') {
        const [w, h] = DEVICES[device];
        const k = Math.min((innerWidth - 24) / w, (bottom - top) / h);
        Object.assign(site.style, { width: w + 'px', height: h + 'px', transform: `scale(${k})` });
        Object.assign(preview.style, { width: w * k + 'px', height: h * k + 'px', left: (innerWidth - w * k) / 2 + 'px', top: top + (bottom - top - h * k) / 2 + 'px' });
      } else {
        const b = bounds(strokes);
        const w = b.x1 - b.x0 + PAD * 4;
        const h = b.y1 - b.y0 + PAD * 4;
        const scale = Math.min(innerWidth / w, (bottom - top) / h);
        rawView = { scale, x: (innerWidth - (b.x1 + b.x0) * scale) / 2, y: top + (bottom - top - (b.y1 + b.y0) * scale) / 2 };
      }
      draw();
    }

    // Where a data unit lands on screen in the mockup: the site's own canvas, scaled down with the frame.
    function heroView() {
      const doc = site.contentDocument;
      const placed = doc?.querySelector('.hero-handwriting');
      const heading = doc?.querySelector('.hero-text h1');
      if (!placed || !heading || !placed.offsetWidth) return null;
      const r = placed.getBoundingClientRect();
      const v = preview.getBoundingClientRect();
      const k = v.width / DEVICES[device][0];
      const b = bounds(strokes);
      const width = Math.ceil(b.x1 - b.x0) + PAD * 2;
      const scale = r.width / width * k;
      const em = parseFloat(site.contentWindow.getComputedStyle(heading).fontSize);
      return {
        scale,
        x: v.left + r.left * k + (PAD - b.x0) * scale,
        y: v.top + r.top * k + (PAD - b.y0) * scale,
        ink: em * 0.1 * (marks.size ?? 1) * k / scale,
        perEm: em * k,
      };
    }

    const currentView = () => mode === 'hero' ? heroView() : rawView;
    const toInput = s => prepareStroke(s.map(([x, y, t, p]) => [x, y, p, t]));

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const view = currentView();
      if (!view) return;
      ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y);

      if (mode === 'raw') {
        strokes.forEach((s, i) => {
          rawPaths[i] ||= strokePath(toInput(s), PEN_SIZE * (marks.weight[i] ?? 1));
          ctx.fillStyle = selected.has(i) ? '#2563eb' : selected.size ? 'rgba(26, 26, 26, 0.35)' : '#1a1a1a';
          ctx.fill(rawPaths[i]);
        });
      } else {
        // The site draws the ink itself; this layer only marks what's selected.
        if (Math.abs(heroPaths.size - view.ink) > 0.05) heroPaths = { size: view.ink, list: [] };
        ctx.fillStyle = '#3b82f6';
        for (const i of selected) {
          heroPaths.list[i] ||= strokePath(toInput(strokes[i]), view.ink * 1.35 * (marks.weight[i] ?? 1));
          ctx.fill(heroPaths.list[i]);
        }
      }

      ctx.font = `600 ${11 / view.scale}px -apple-system, sans-serif`;
      ctx.lineWidth = 3 / view.scale;
      ctx.strokeStyle = mode === 'hero' ? 'rgba(0, 0, 0, 0.6)' : '#fafafa';
      strokes.forEach((s, i) => {
        if (mode === 'hero' && !selected.has(i)) return;
        const at = [s[0][0] + 3 / view.scale, s[0][1] - 4 / view.scale];
        ctx.strokeText(i, ...at);
        ctx.fillStyle = selected.has(i) ? '#60a5fa' : '#d70015';
        ctx.fillText(i, ...at);
      });

      if (drag?.kind === 'box') {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const [x0, y0, x1, y1] = drag.box;
        ctx.fillStyle = 'rgba(59, 130, 246, 0.15)';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
        ctx.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0, y1 - y0);
      }
    }

    // The mockup re-lays itself out after every preview message, so the selection is redrawn each frame.
    (function follow() {
      if (mode === 'hero') draw();
      requestAnimationFrame(follow);
    })();

    function updateUI() {
      chips.replaceChildren(...strokes.map((_, i) => {
        const b = document.createElement('button');
        b.textContent = marks.eyes.includes(i) ? `${i} eye` : i;
        b.className = selected.has(i) ? 'on' : '';
        b.onclick = () => { selected.has(i) ? selected.delete(i) : selected.add(i); updateUI(); draw(); };
        return b;
      }));
      const n = selected.size;
      for (const id of ['smaller', 'bigger', 'ccw', 'cw', 'delete', 'none']) buttons[id].disabled = n === 0;
      document.getElementById('size').textContent = Math.round((marks.size ?? 1) * 100) + '%';
      buttons.mode.textContent = mode === 'hero' ? 'Raw strokes' : 'Hero mockup';
      buttons.undo.disabled = history.length === 0;
      const key = [...selected].sort((a, b) => a - b).join(',');
      if (key !== updateUI.selection) turned = 0;
      updateUI.selection = key;
      if (!status.dataset.sticky) {
        const angle = turned ? ` · rotated ${turned > 0 ? '+' : '−'}${Math.abs(turned).toFixed(2)}°` : '';
        status.textContent = (n === strokes.length ? `All ${n} strokes selected: drag to place on the page`
          : n ? `Selected ${key.replaceAll(',', ', ')}`
          : mode === 'hero' ? 'Tap a stroke, or drag a box around a word' : 'Tap a stroke') + angle;
      }
    }

    const toData = (e, view) => [(e.clientX - view.x) / view.scale, (e.clientY - view.y) / view.scale];

    function hit([x, y], view) {
      let best = -1, bestD = 14 / view.scale;
      strokes.forEach((s, i) => {
        for (const [px, py] of s) {
          const d = Math.hypot(px - x, py - y);
          if (d < bestD) { bestD = d; best = i; }
        }
      });
      return best;
    }

    canvas.addEventListener('pointerdown', e => {
      delete status.dataset.sticky;
      const view = currentView();
      if (!view) return;
      const at = toData(e, view);
      const i = hit(at, view);
      canvas.setPointerCapture(e.pointerId);
      const base = { id: e.pointerId, start: [e.clientX, e.clientY], view, original: state(), moved: false };
      if (i < 0) {
        drag = { ...base, kind: 'box', additive: e.shiftKey || e.metaKey, box: [e.clientX, e.clientY, e.clientX, e.clientY] };
        return;
      }
      if (e.shiftKey || e.metaKey) selected.has(i) ? selected.delete(i) : selected.add(i);
      else if (!selected.has(i)) selected = new Set([i]);
      const whole = mode === 'hero' && selected.size === strokes.length;
      drag = { ...base, kind: whole ? 'place' : 'strokes', from: marks.offset ?? { x: 0, y: 0 } };
      updateUI();
      draw();
    });

    canvas.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.start[0];
      const dy = e.clientY - drag.start[1];
      if (!drag.moved && Math.hypot(dx, dy) < 3) return;
      drag.moved = true;
      if (drag.kind === 'box') {
        drag.box = [Math.min(drag.start[0], e.clientX), Math.min(drag.start[1], e.clientY), Math.max(drag.start[0], e.clientX), Math.max(drag.start[1], e.clientY)];
        draw();
      } else if (drag.kind === 'place') {
        const r = n => Math.round(n * 100) / 100;
        marks = { ...marks, offset: { x: r(drag.from.x + dx / drag.view.perEm), y: r(drag.from.y + dy / drag.view.perEm) } };
        site.contentWindow?.postMessage({ offset: marks.offset }, location.origin);
      } else {
        const original = JSON.parse(drag.original).strokes;
        const sx = dx / drag.view.scale, sy = dy / drag.view.scale;
        for (const i of selected) strokes[i] = original[i].map(([px, py, t, p]) => [px + sx, py + sy, t, p]);
        rawPaths = [];
        heroPaths.list = [];
        if (mode === 'hero') queuePreview();
        else draw();
      }
    });

    const endDrag = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const { kind, moved, box, view, additive, original } = drag;
      drag = null;
      if (kind === 'box') {
        if (!additive) selected.clear();
        if (moved) {
          const [x0, y0] = toData({ clientX: box[0], clientY: box[1] }, view);
          const [x1, y1] = toData({ clientX: box[2], clientY: box[3] }, view);
          strokes.forEach((s, i) => {
            const inside = s.filter(([x, y]) => x >= x0 && x <= x1 && y >= y0 && y <= y1).length;
            if (inside * 2 >= s.length) selected.add(i);
          });
        }
        updateUI();
        draw();
        return;
      }
      if (moved) {
        history.push(original);
        changed();
      }
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    function transformSelection(fn) {
      snapshot();
      const b = bounds([...selected].map(i => strokes[i]));
      const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
      for (const i of selected) strokes[i] = strokes[i].map(([x, y, t, p]) => [...fn(x - cx, y - cy).map((v, k) => v + (k ? cy : cx)), t, p]);
      changed();
    }

    const scaleSelection = k => transformSelection((x, y) => [x * k, y * k]);
    function rotated(list, degrees, cx, cy) {
      const cos = Math.cos(degrees * Math.PI / 180), sin = Math.sin(degrees * Math.PI / 180);
      return list.map(([x, y, t, p]) => [cx + (x - cx) * cos - (y - cy) * sin, cy + (x - cx) * sin + (y - cy) * cos, t, p]);
    }

    function rotateSelection(degrees) {
      turned += degrees;
      const cos = Math.cos(degrees * Math.PI / 180), sin = Math.sin(degrees * Math.PI / 180);
      transformSelection((x, y) => [x * cos - y * sin, x * sin + y * cos]);
    }

    // Holding a rotate button keeps turning, always from where the press started, so repeated
    // small steps don't drift and the whole hold is one undo.
    function holdRotate(button, direction) {
      button.addEventListener('pointerdown', e => {
        if (button.disabled || !selected.size) return;
        button.setPointerCapture(e.pointerId);
        const original = state();
        const from = JSON.parse(original).strokes;
        const b = bounds([...selected].map(i => strokes[i]));
        const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
        const startTurn = turned;
        let angle = 0;
        const turn = () => {
          angle += direction * step;
          turned = Math.round((startTurn + angle) * 100) / 100;
          for (const i of selected) strokes[i] = rotated(from[i], angle, cx, cy);
          rawPaths = [];
          heroPaths.list = [];
          queuePreview();
          updateUI();
          draw();
        };
        turn();
        let timer = setTimeout(function repeat() { turn(); timer = setTimeout(repeat, 70); }, 350);
        const stop = () => {
          clearTimeout(timer);
          button.removeEventListener('pointerup', stop);
          button.removeEventListener('pointercancel', stop);
          history.push(original);
          changed();
        };
        button.addEventListener('pointerup', stop);
        button.addEventListener('pointercancel', stop);
      });
    }

    function resizeOnSite(step) {
      snapshot();
      marks = { ...marks, size: Math.round(Math.min(1.6, Math.max(0.6, (marks.size ?? 1) + step)) * 100) / 100 };
      changed();
    }

    buttons.all.onclick = () => { selected = new Set(strokes.keys()); updateUI(); draw(); };
    buttons.none.onclick = () => { selected.clear(); updateUI(); draw(); };
    holdRotate(buttons.ccw, -1);
    holdRotate(buttons.cw, 1);
    buttons.step.onclick = () => {
      step = STEPS[(STEPS.indexOf(step) + 1) % STEPS.length];
      buttons.step.textContent = `${step}°`;
    };
    buttons.smaller.onclick = () => scaleSelection(1 / 1.05);
    buttons.bigger.onclick = () => scaleSelection(1.05);
    buttons.shrink.onclick = () => resizeOnSite(-0.05);
    buttons.grow.onclick = () => resizeOnSite(0.05);
    buttons.replay.onclick = () => sendPreview(false);
    buttons.recenter.onclick = () => {
      snapshot();
      marks = { ...marks, offset: { x: 0, y: 0 } };
      changed();
    };
    buttons.mode.onclick = () => {
      mode = mode === 'hero' ? 'raw' : 'hero';
      layout();
    };
    for (const b of document.querySelectorAll('[data-device]')) {
      b.onclick = () => {
        device = b.dataset.device;
        for (const other of document.querySelectorAll('[data-device]')) other.classList.toggle('on', other === b);
        layout();
      };
    }
    site.addEventListener('load', () => sendPreview());
    if (site.contentDocument?.readyState === 'complete') sendPreview();

    buttons.delete.onclick = () => {
      snapshot();
      const renumber = new Map();
      strokes.forEach((_, i) => { if (!selected.has(i)) renumber.set(i, renumber.size); });
      strokes = strokes.filter((_, i) => !selected.has(i));
      marks = {
        eyes: marks.eyes.filter(i => renumber.has(i)).map(i => renumber.get(i)),
        weight: Object.fromEntries(Object.entries(marks.weight).filter(([i]) => renumber.has(+i)).map(([i, w]) => [renumber.get(+i), w])),
        pauseAfter: Object.fromEntries(Object.entries(marks.pauseAfter ?? {}).filter(([i]) => renumber.has(+i)).map(([i, ms]) => [renumber.get(+i), ms])),
        size: marks.size,
        offset: marks.offset,
      };
      selected.clear();
      changed();
    };

    buttons.undo.onclick = () => {
      turned = 0;
      setState(history.pop());
      selected = new Set([...selected].filter(i => i < strokes.length));
      changed();
    };

    buttons.restore.onclick = () => {
      snapshot();
      setState(draft);
      selected.clear();
      buttons.restore.hidden = true;
      changed();
    };

    addEventListener('keydown', e => {
      const step = e.shiftKey ? 10 : 1;
      const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (move && selected.size) {
        e.preventDefault();
        snapshot();
        for (const i of selected) strokes[i] = strokes[i].map(([x, y, t, p]) => [x + move[0], y + move[1], t, p]);
        changed();
      } else if ((e.key === '[' || e.key === ']') && selected.size) {
        rotateSelection((e.key === '[' ? -1 : 1) * step);
      } else if (e.key === 'a' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        buttons.all.click();
      } else if ((e.key === 'Backspace' || e.key === 'Delete') && selected.size) {
        buttons.delete.click();
      } else if (e.key === 'z' && (e.metaKey || e.ctrlKey) && history.length) {
        buttons.undo.click();
      }
    });

    buttons.save.onclick = async () => {
      status.dataset.sticky = '1';
      status.textContent = 'Saving…';
      try {
        const res = await fetch('save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(exportData()) });
        if (!res.ok) throw new Error(res.status);
        status.textContent = 'Saved to handwriting.json';
        try { localStorage.removeItem(DRAFT_KEY); } catch {}
        buttons.restore.hidden = true;
      } catch {
        status.textContent = 'Not saved (edits kept as a draft): is serve.py running?';
      }
    };

    addEventListener('resize', layout);
    layout();
  </script>
</body>
</html>
