<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Room">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Room Coach</title>
<style>
:root {
  --bg: #000000; --card: #1c1c1e; --raised: #636366; --ink: #ffffff; --dim: #98989f; --sep: #38383a; color-scheme: dark;
  --display: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  --body: -apple-system, "SF Pro Text", BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; overflow: hidden }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 var(--body); -webkit-font-smoothing: antialiased }
.wrap { height: 100%; max-width: 440px; margin: 0 auto; padding-top: calc(env(safe-area-inset-top, 0px) + clamp(8px, 1.8vh, 18px)); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(8px, 1.8vh, 18px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 14px) }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.seg { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 9px; padding: 2px }
.seg button { border: 0; background: none; border-radius: 7px; padding: 6px 4px; font-size: 13px; font-weight: 500 }
.seg button[aria-pressed="true"] { background: var(--raised); font-weight: 600 }
.head { flex: none; display: flex; flex-direction: column; gap: 2px; padding: 2px 4px 0 }
.head h1 { margin: 0; font: 700 clamp(24px, 4vh, 32px)/1.1 var(--display); letter-spacing: -0.02em }
.hero { flex: 1 1 0; min-height: 80px }
.hero canvas { display: block; width: 100%; height: 100% }
.tiles { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
.tile { background: var(--card); border-radius: 16px; padding: clamp(9px, 1.5vh, 13px) 12px; display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.tile .k { font-size: 12px; font-weight: 500; color: var(--dim) }
.tile .v { font: 600 clamp(20px, 3.2vh, 26px)/1.05 var(--display); letter-spacing: -0.02em; white-space: nowrap; font-variant-numeric: tabular-nums }
.four .tile { border-radius: 14px; padding-inline: 10px }
.four .tile .v { font-size: clamp(17px, 2.6vh, 21px) }
.v.off { color: var(--dim) }
.list { flex: none; background: var(--card); border-radius: 14px; padding: 0 12px 0 16px }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px }
.row .note { color: var(--dim); font-size: 14px; margin-left: auto }
.switch { flex: none; width: 51px; height: 31px; border-radius: 16px; border: 0; padding: 2px; background: var(--raised); display: flex }
.switch::after { content: ""; width: 27px; height: 27px; border-radius: 50%; background: var(--ink); transition: transform .2s }
.switch[aria-checked="true"] { background: var(--ink) }
.switch[aria-checked="true"]::after { background: var(--bg); transform: translateX(20px) }
.switch:disabled { opacity: .4 }
.foot { flex: none; margin: 0; color: var(--dim); font-size: 13px; padding: 0 4px }
.key { display: flex; gap: 8px }
.key input { flex: 1; min-width: 0; background: var(--card); color: var(--ink); border: 0; border-radius: 10px; padding: 10px 12px; font: inherit }
.link { background: none; border: 0; padding: 0 4px; font-weight: 600; font-size: 15px }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none } }
.foot:has(> [hidden]:only-child) { display: none }
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" role="group" aria-label="What you are doing">
    <button type="button" id="mode-awake" data-mode="awake" aria-pressed="true">Awake</button>
    <button type="button" id="mode-sleep" data-mode="sleep" aria-pressed="false">Sleeping</button>
    <button type="button" id="mode-away" data-mode="away" aria-pressed="false">Away</button>
  </div>
  <div class="head" aria-live="polite">
    <h1 id="tag">Reading sensors</h1>
  </div>
  <div class="hero"><canvas id="room" role="img" aria-label="Your room, showing the window, door and fan as they should be set"></canvas></div>
  <div class="tiles" aria-live="polite">
    <div class="tile"><span class="k">Door</span><span class="v off" id="door">--</span></div>
    <div class="tile"><span class="k">Window</span><span class="v off" id="window">--</span></div>
    <div class="tile"><span class="k">Fan</span><span class="v off" id="fan">--</span></div>
  </div>
  <div class="tiles four">
    <div class="tile"><span class="k">Desk</span><span class="v off" id="t-desk">--</span></div>
    <div class="tile"><span class="k">Bed</span><span class="v off" id="t-bed">--</span></div>
    <div class="tile"><span class="k">CO2 ppm</span><span class="v off" id="co2">--</span></div>
    <div class="tile"><span class="k">Outside</span><span class="v off" id="out">--</span></div>
  </div>
  <div class="list"><div class="row"><span>Alerts</span><span class="note" id="alerts-note"></span><button class="switch" id="alerts" type="button" role="switch" aria-checked="false" aria-label="Alerts"></button></div></div>
  <p class="foot" id="why" hidden></p>
  <form class="foot key" id="keyform" hidden><input id="key" type="password" autocomplete="off" aria-label="App key" placeholder="App key"><button class="link" type="submit">Save</button></form>
</div>
<script>
const K = { TARGET: 66.5, LO: 65, HI: 68, B: 63, TBLDG: 74, PERSON: 90, KW: 0.488, FULL: 26, BSHORT: 180, TAU: 43, PC_IDLE: 100,
            AW_LO: 68, AW_HI: 72, AW_AIM: 70, CO2_HI: 1000 };
const cToF = c => (c == null ? null : c * 9 / 5 + 32);
function holdWidth(target, out, watts, people) {
  const d = target - out; if (d < 3) return null;
  return Math.max(0, (watts + K.PERSON * people + K.B * (K.TBLDG - target)) / (K.KW * Math.pow(d, 1.5)));
}
function co2Width(people, inF, outF) { const dK = (inF - outF) * 5 / 9; return dK < 1 ? null : 13.7 * people / (1.05 * Math.sqrt(dK)); }
function fullOpenFloor(out, watts, people) {
  let lo = out + 0.1, hi = 90;
  const f = T => K.BSHORT * (K.TBLDG - T) + watts + K.PERSON * people - K.KW * K.FULL * Math.pow(T - out, 1.5);
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (f(m) > 0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const clampW = w => Math.max(0, Math.min(K.FULL, Math.round(w)));
const f1 = x => (Math.round(x * 10) / 10).toFixed(1);

function advise(s) {
  if (s.ageMin == null || s.bedF == null) return { error: "No sensor readings yet." };
  if (s.ageMin > 10) return { error: "Sensor data is " + Math.round(s.ageMin) + " min old. No advice until a fresh reading arrives." };
  if (s.mode === "away") return { door: "open", window: 0, fan: "off", conf: "Certain", phase: null, why: "Nobody is in the room, so keep the heat in." };
  if (s.outF == null) return { error: "No outdoor reading yet. It refreshes every 10 minutes." };
  const out = s.outF, n = 1;
  if (s.mode === "sleep") {
    const outEff = s.lowF == null ? out : (out + s.lowF) / 2, H = holdWidth(K.TARGET, outEff, s.watts, n), wc = co2Width(n, s.bedF, out);
    if (H == null) return { door: "closed", window: K.FULL, fan: "low", conf: "Estimate", phase: null, why: "Too mild outside (" + f1(outEff) + "°F) for the window alone to hold 66.5°F." };
    let phase = s.phase === "precool" || s.phase === "warm" ? s.phase : null;
    if (s.bedF > K.HI + 0.5) phase = "precool"; else if (phase === "precool" && s.bedF <= 67) phase = null;
    if (s.bedF < K.LO) phase = "warm"; else if (phase === "warm" && s.bedF >= 66) phase = null;
    if (phase === "precool") {
      const floor = fullOpenFloor(out, s.watts, n), eta = floor < 66.7 ? K.TAU * Math.log((s.bedF - floor) / (67 - floor)) : null;
      return { door: "closed", window: K.FULL, fan: "high", conf: "Measured", phase,
        why: "Bed is " + f1(s.bedF) + "°F. Cooling to 67" + (eta > 0 ? ", about " + Math.max(5, Math.round(eta / 5) * 5) + " min" : "") + ". Then this changes to " + clampW(H) + " in, fan off." };
    }
    if (phase === "warm") return { door: "closed", window: 0, fan: "off", conf: "Measured", phase,
        why: "Bed is " + f1(s.bedF) + "°F, too cold. At 66 this changes to " + clampW(Math.max(1, H - 2)) + " in." };
    let w = H, trim = "";
    if (s.slope != null && s.bedF > 67.5 && s.slope >= 0) { w += 2; trim = " Plus 2 in, it is warm and not falling."; }
    if (s.slope != null && s.bedF < 65.8 && s.slope <= 0) { w -= 2; trim = " Minus 2 in, it is cool and not rising."; }
    let win = clampW(w), conf = "Measured", why = "Bed is " + f1(s.bedF) + "°F. This holds 66.5 with " + f1(outEff) + "°F outside tonight." + trim;
    if (s.co2 != null && s.co2 >= K.CO2_HI && wc != null && win < Math.ceil(wc)) { win = clampW(Math.ceil(wc)); conf = "Estimate"; why += " Raised for CO2 at " + Math.round(s.co2) + " ppm."; }
    return { door: "closed", window: win, fan: "off", conf, phase: null, why };
  }
  const t = s.deskF != null ? s.deskF : s.bedF, wc = co2Width(n, t, out), co2 = s.co2 == null ? "?" : Math.round(s.co2);
  let phase = s.phase === "cold" ? "cold" : null;
  if (t < K.AW_LO) phase = "cold"; else if (t > 69) phase = null;
  if (t > K.AW_HI) {
    const W = holdWidth(K.AW_AIM, out, s.watts, n);
    return { door: "closed", window: W == null ? K.FULL : clampW(Math.max(W, wc || 0, 1)), fan: "low", conf: "Estimate", phase: null, why: "Desk is " + f1(t) + "°F, above 72. This should bring it to about 70." };
  }
  if (phase === "cold") {
    const high = s.co2 != null && s.co2 >= 1200;
    return { door: "open", window: high ? 2 : 0, fan: "off", conf: "Estimate", phase,
      why: "Desk is " + f1(t) + "°F, below 68. The open door brings in warmth and fresh air from the apartment" + (high ? ", and CO2 is " + co2 + " ppm so keep a small gap." : ".") };
  }
  return { door: "closed", window: wc == null ? 2 : clampW(Math.ceil(wc)), fan: "off", conf: "Estimate", phase: null,
    why: "Desk is " + f1(t) + "°F, CO2 " + co2 + " ppm. This gap keeps CO2 near 800 without wasting heat." };
}

const ENDPOINT = "https://hxaftcofwrffwjxtjeoj.supabase.co/functions/v1/room";
const VAPID = "BO8s0WNjBYLWpIvpkIMxvAm4niN7hTg2DxQX5d_jbOBNM4QqMW-GCL961mCG4EC68jUebZ_3LvEzdfnSBfO4yt8";
const $ = id => document.getElementById(id);
const st = { mode: "awake", phase: null };
let snap = null, snapAt = 0, busy = false, key = "";
try { Object.assign(st, JSON.parse(localStorage.getItem("room-coach-min") || "{}")); } catch (e) {}
const keep = () => { try { localStorage.setItem("room-coach-min", JSON.stringify(st)); } catch (e) {} };

function inputs() {
  const now = Date.parse(snap.now), bed = snap.bed, desk = snap.desk, o = snap.outdoor, pc = snap.pc;
  const avgNow = snap.bed_now && snap.bed_now.n > 0 ? snap.bed_now : null, prev = snap.bed_prev && snap.bed_prev.n > 0 ? snap.bed_prev : null;
  const bedF = cToF(avgNow ? Number(avgNow.temp_c) : bed ? Number(bed.temp_c) : null);
  return { mode: st.mode, phase: st.phase, bedF,
    deskF: desk && (now - Date.parse(desk.ts)) < 15 * 60000 ? cToF(Number(desk.temp_c)) : null,
    co2: bed && bed.co2 != null ? Number(bed.co2) : null,
    outF: o && o.temp_c != null ? cToF(Number(o.temp_c)) : null, lowF: o && o.low_next10h_c != null ? cToF(Number(o.low_next10h_c)) : null,
    watts: pc && pc.n > 0 && pc.watts != null ? Number(pc.watts) : K.PC_IDLE,
    slope: avgNow && prev && bedF != null ? bedF - cToF(Number(prev.temp_c)) : null,
    ageMin: bed ? (now - Date.parse(bed.ts)) / 60000 + (performance.now() - snapAt) / 60000 : null };
}
function onBlank(askKey) { $("keyform").hidden = !askKey; }
function onGood() { $("keyform").hidden = true; $("why").hidden = true; }
const STEPS = [[0, "Closed"], [3.25, "1/8"], [6.5, "1/4"], [13, "1/2"], [26, "Full"]];
function snapW(inches) {
  if (inches < 1.6) return STEPS[0];
  return STEPS.slice(1).reduce((best, s) => (Math.abs(Math.log(inches / s[0])) < Math.abs(Math.log(inches / best[0])) ? s : best));
}
function show(id, text, off, color) { const el = $(id); el.textContent = text; el.className = off ? "v off" : "v"; el.style.color = off || !color ? "" : color; }
const C = { cold: "#64d2ff", good: "#30d158", fair: "#ffd60a", warm: "#ff9f0a", bad: "#ff453a", ice: "#5e9eff" };
function roomColor(t, lo, hi) { return t < lo ? C.cold : t <= hi ? C.good : t <= hi + 3 ? C.warm : C.bad; }
function blank(msg, extra) {
  for (const id of ["door", "window", "fan", "t-desk", "t-bed", "co2", "out"]) show(id, "--", true);
  $("tag").textContent = "Paused"; $("why").hidden = false; $("why").textContent = msg; onBlank(extra);
}
function render() {
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.mode === st.mode));
  if (!snap) return;
  const s = inputs(), a = advise(s);
  if (a.error) { blank(a.error); return; }
  if (a.phase !== st.phase) { st.phase = a.phase; keep(); }
  show("door", a.door === "open" ? "Open" : "Closed");
  const step = snapW(a.window);
  show("window", step[1]);
  show("fan", a.fan.charAt(0).toUpperCase() + a.fan.slice(1), a.fan === "off");
  viz.set(step[0], a.door === "open", a.fan);
  $("tag").textContent = st.mode === "away" ? "Nobody home" : st.mode === "sleep"
    ? (a.phase === "precool" ? "Cooling to 67°" : a.phase === "warm" ? "Warming to 66°" : a.fan === "low" ? "Mild night" : "Holding 66.5°")
    : (a.fan === "low" ? "Desk above 72°" : a.phase === "cold" ? "Desk below 68°" : "Holding CO2");
  const lo = st.mode === "sleep" ? K.LO : K.AW_LO, hi = st.mode === "sleep" ? K.HI : K.AW_HI;
  show("t-desk", s.deskF == null ? "--" : f1(s.deskF) + "\u00B0", s.deskF == null, s.deskF == null ? "" : roomColor(s.deskF, lo, hi));
  show("t-bed", f1(s.bedF) + "\u00B0", false, roomColor(s.bedF, lo, hi));
  show("co2", s.co2 == null ? "--" : String(Math.round(s.co2)), s.co2 == null, s.co2 == null ? "" : s.co2 < 800 ? C.good : s.co2 < 1000 ? C.fair : s.co2 < 1400 ? C.warm : C.bad);
  show("out", s.outF == null ? "--" : f1(s.outF) + "\u00B0", s.outF == null, s.outF == null ? "" : s.outF <= 32 ? C.ice : s.outF < 50 ? C.cold : s.outF < 68 ? C.good : s.outF < 80 ? C.fair : C.warm);
  onGood();
}

const viz = (() => {
  const cv = $("room"), ctx = cv.getContext("2d");
  const W = 3.33, D = 3.685, DM = 2.865, NX = 1.65, H = 2.4, CUT = 2.4, YAW = Math.PI / 4, FULL_M = 0.70, SPEED = { off: 0, low: 2.2, med: 4.5, high: 8 };
  const want = { gap: 0, door: 0, fan: "off" }, cur = { gap: 0, door: 0, speed: 0 };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, yaw = YAW, spin = 0, last = performance.now(), sc = 1, ox = 0, oy = 0;
  function size() {
    const r = cv.getBoundingClientRect(), d = Math.min(3, window.devicePixelRatio || 1);
    w = r.width; h = r.height; cv.width = Math.max(1, Math.round(w * d)); cv.height = Math.max(1, Math.round(h * d));
    ctx.setTransform(d, 0, 0, d, 0, 0);
    sc = 1; ox = 0; oy = 0;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const a of [YAW]) {
      yaw = a;
      for (const [x, z] of [[0, 0], [W + 0.09, 0], [W + 0.09, DM + 0.09], [NX, D + 0.09], [0, D + 0.09]]) for (const y of [-0.16, 2.4]) {
        const p = P(x, y, z); x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
    }
    yaw = YAW; sc = Math.min(w * 0.96 / (x1 - x0), h * 0.96 / (y1 - y0));
    ox = w / 2 - sc * (x0 + x1) / 2; oy = h / 2 - sc * (y0 + y1) / 2;
  }
  function P(x, y, z) {
    const cx = x - W / 2, cy = y - H / 2, cz = z - D / 2, c = Math.cos(yaw), s = Math.sin(yaw), ph = 0.6155;
    const x1 = cx * c - cz * s, z1 = cx * s + cz * c, y1 = cy * Math.cos(ph) + z1 * Math.sin(ph), z2 = -cy * Math.sin(ph) + z1 * Math.cos(ph), k = 1;
    return [ox + x1 * k * sc, oy - y1 * k * sc];
  }
  function poly(pts, fill, stroke, lw) {
    ctx.beginPath();
    pts.forEach((p, i) => { const q = P(p[0], p[1], p[2]); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }
  function seg(a, b, stroke, lw) { const p = P(a[0], a[1], a[2]), q = P(b[0], b[1], b[2]); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  const wallZ = (z, x0, x1, fill, stroke) => poly([[x0, 0, z], [x1, 0, z], [x1, CUT, z], [x0, CUT, z]], fill, stroke);
  const wallX = (x, z0, z1, fill, stroke) => poly([[x, 0, z0], [x, 0, z1], [x, CUT, z1], [x, CUT, z0]], fill, stroke);
  const T = 0.09, SLAB = 0.16;
  const tone = (hex, k) => {
    const n = parseInt(hex.slice(1), 16), cool = k < 0.9 ? 1.06 : 1, f = (v, m) => Math.round(Math.max(0, Math.min(255, v * k * m)));
    return "rgb(" + f(n >> 16, 1 / cool) + "," + f(n >> 8 & 255, 1) + "," + f(n & 255, cool) + ")";
  };
  const tri = (a, b, c, fill) => poly([a, b, c], fill, fill, 0.7);
  function quad(a, b, c, d, color, k) { tri(a, b, c, tone(color, k)); tri(a, c, d, tone(color, k * 0.94)); }
  function box(x0, x1, y0, y1, z0, z1, color, edge) {
    quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], color, 0.62);
    quad([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], color, 0.8);
    quad([x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], color, 1.04);
    if (edge) {
      poly([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], null, edge, 1.2);
      poly([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], null, edge, 1.2);
      poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], null, edge, 1.2);
    }
  }
  function shadow(x0, x1, z0, z1, hgt) {
    const d = Math.min(0.3, hgt * 0.3), zmax = x1 + d <= NX ? D : DM;
    poly([[x0, 0.003, z1], [x1, 0.003, z0], [Math.min(W, x1 + d), 0.003, z0 + d], [Math.min(W, x1 + d), 0.003, Math.min(zmax, z1 + d)], [x0 + d, 0.003, Math.min(zmax, z1 + d)]], "rgba(20,18,30,0.22)", null);
  }
  const WHITE = "#f4f4f8", BLUE = "#4f86e8", INK = "#17171a", WALL = "#dcdad6", WOOD = "#dba968";
  const items = [
    { x: 0.85, z: D - 0.12, h: 0, draw() {
      box(0.35, 1.35, 0.28, 0.72, D - 0.24, D, "#e3d6b8");
      quad([0.45, 0.721, D - 0.19], [1.25, 0.721, D - 0.19], [1.25, 0.721, D - 0.07], [0.45, 0.721, D - 0.07], "#a99c7e", 1);
    } },
    { x: 0.27, z: 2.08, s: [0, 0.55, 1.605, 2.565, 0.5], draw() {

      const m = 0.1, zl = cz0 + 0.305 - m, zr = cz0 - 0.305 + m, yb = py0 + m, yt = py1 - m;
      tri([px, yt, zl], [px, yt, zr], [px, yb, zl], upper); tri([px, yt, zr], [px, yb, zr], [px, yb, zl], lower);

    const c = Math.cos(yaw), sn = Math.sin(yaw);
    items.map(o => [(o.x - W / 2) * sn + (o.z - D / 2) * c, o]).sort((a, b) => b[0] - a[0]).forEach(p => p[1].draw());

function stale(msg) { $("why").hidden = false; $("why").textContent = msg; }

}
